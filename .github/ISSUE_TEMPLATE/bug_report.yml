name: Bug report
description: Report a reproducible SessionCrate problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please do not include session transcripts, credentials, tokens, or private paths.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the command that triggered it.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use a synthetic fixture or redacted example where possible.
      placeholder: |
        1. Run ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SessionCrate version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and Python version
      placeholder: "macOS 15 / Python 3.12"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized output
      description: Paste output after removing transcripts, credentials, tokens, and private paths.
      render: text
