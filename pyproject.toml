[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sessioncrate"
version = "0.1.0"
description = "Local compressed AI coding session archives with content search and verified restoration"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Version Control",
]

[project.scripts]
sessioncrate = "codex_vault.cli:main"

[project.urls]
Homepage = "https://github.com/ictechgy/sessioncrate"
Documentation = "https://github.com/ictechgy/sessioncrate#readme"
Issues = "https://github.com/ictechgy/sessioncrate/issues"
Source = "https://github.com/ictechgy/sessioncrate"

[tool.setuptools]
packages = ["codex_vault"]
